<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>站点导航</title>
  <style>
    :root {
      /* 主题色：可以根据喜好调整 */
      --primary-color: #667eea;
      --glass-bg: rgba(20, 20, 20, 0.6);
      /* 深色毛玻璃背景，对比度更高 */
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-color: #ffffff;
      --item-hover: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 核心：禁止页面本身滚动，确保 iframe 占满 */
    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      /* iframe 加载前的背景色 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Iframe 容器 */
    #main-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }

    /* 侧边栏抽屉 */
    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 280px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      transform: translateX(-100%);
      /* 默认隐藏 */
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      box-shadow: 5px 0 15px rgba(0, 0, 0, 0.3);
    }

    .drawer.open {
      transform: translateX(0);
    }

    /* 侧边栏标题 */
    .drawer-header {
      padding: 20px;
      font-size: 1.2rem;
      color: var(--text-color);
      font-weight: bold;
      border-bottom: 1px solid var(--glass-border);
    }

    /* 列表区域 */
    .site-list {
      flex: 1;
      overflow-y: auto;
      /* 列表过长时内部滚动 */
      padding: 10px 0;
    }

    .site-item {
      padding: 15px 20px;
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      font-size: 0.95rem;
    }

    .site-item:hover {
      background: var(--item-hover);
      color: #fff;
      padding-left: 25px;
      /*以此增加悬停动感*/
    }

    .site-item.active {
      background: rgba(102, 126, 234, 0.3);
      /* 激活状态背景 */
      color: #fff;
      border-left: 4px solid var(--primary-color);
    }

    /* 悬浮按钮 (Toggle Button) */
    .toggle-btn {
      position: fixed;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 60px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      border-radius: 0 10px 10px 0;
      cursor: pointer;
      z-index: 1001;
      /* 比抽屉高，始终可见 */
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transition: all 0.4s ease;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.2);
    }

    /* 按钮内部图标/箭头 */
    .toggle-btn::after {
      content: '›';
      font-size: 24px;
      font-weight: bold;
      margin-left: -2px;
      transition: transform 0.3s;
    }

    /* 抽屉打开时，按钮随之移动并变形 */
    .drawer.open~.toggle-btn {
      left: 280px;
      /* 跟随抽屉宽度 */
    }

    .drawer.open~.toggle-btn::after {
      transform: rotate(180deg);
      /* 箭头反转 */
    }

    /* 核心需求：吸附进边界效果 */
    /* 当没有 hover 且抽屉未打开时，收缩进左侧 */
    .toggle-btn:not(:hover) {
      opacity: 0.3;
      /* 变淡 */
      width: 15px;
      /* 变窄 */
      left: -5px;
      /* 稍微缩进屏幕外 */
    }

    /* 抽屉打开时保持按钮高亮，不收缩 */
    .drawer.open~.toggle-btn:not(:hover) {
      opacity: 1;
      width: 40px;
      left: 280px;
    }

    /* 遮罩层 (在移动端点击外部关闭侧边栏) */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .drawer.open~.overlay {
      opacity: 1;
      pointer-events: auto;
    }

    /* 移动端适配 */
    @media (max-width: 768px) {
      .drawer {
        width: 75vw;
        /* 移动端抽屉占宽 75% */
      }

      .drawer.open~.toggle-btn {
        left: 75vw;
      }
    }
  </style>
</head>

<body>

  <div class="drawer" id="drawer">
    <div class="drawer-header">站点列表</div>
    <div class="site-list" id="siteList">
    </div>
  </div>

  <div class="overlay" id="overlay" onclick="toggleDrawer(false)"></div>

  <div class="toggle-btn" id="toggleBtn" onclick="toggleDrawer()"></div>

  <iframe id="main-frame" src="" name="content-frame"
    sandbox="allow-forms allow-scripts allow-same-origin allow-popups"></iframe>

  <script>
    /**
     * 配置区域
     * 在这里填入你的 ipv4:port 网站
     */
    const sites = [
      { name: "Wu Junkai's alist", url: "http://47.121.28.18:5244" },
      { name: "百度", url: "https://www.baidu.com" }
    ];

    // ---------------- 逻辑代码 ----------------

    const drawer = document.getElementById('drawer');
    const siteListContainer = document.getElementById('siteList');
    const mainFrame = document.getElementById('main-frame');

    // 1. 初始化列表
    function initList() {
      // 如果有站点，默认加载第一个
      if (sites.length > 0) {
        loadSite(sites[0].url, 0);
      }

      sites.forEach((site, index) => {
        const item = document.createElement('div');
        item.className = 'site-item';
        item.innerText = site.name;
        item.onclick = () => {
          loadSite(site.url, index);
          // 移动端点击后自动收起菜单，PC端可以保持打开方便切换，这里选择统一收起
          // 如果你想PC端点击不收起，可以加个判断
          if (window.innerWidth < 768) {
            toggleDrawer(false);
          }
        };
        siteListContainer.appendChild(item);
      });
    }

    // 2. 加载站点
    function loadSite(url, index) {
      mainFrame.src = url;

      // 更新高亮状态
      const items = document.querySelectorAll('.site-item');
      items.forEach(el => el.classList.remove('active'));
      if (items[index]) {
        items[index].classList.add('active');
      }
    }

    // 3. 切换侧边栏状态
    function toggleDrawer(forceState) {
      if (typeof forceState === 'boolean') {
        if (forceState) drawer.classList.add('open');
        else drawer.classList.remove('open');
      } else {
        drawer.classList.toggle('open');
      }
    }

    // 初始化运行
    initList();

    // 4. 特别注意：关于混合内容 (Mixed Content)
    // 如果你把这个页面部署在 HTTPS (如 GitHub Pages) 上，
    // 浏览器会阻止 Iframe 加载 HTTP 的 (ipv4:port) 网站。
    // 建议：这个 html 文件最好直接在本地双击打开，或者部署在和目标网站相同的 HTTP 环境下。
    if (window.location.protocol === 'https:') {
      console.warn("注意：当前页面通过 HTTPS 访问，可能无法在 Iframe 中加载 HTTP 协议的 IP 网站 (Mixed Content 错误)。建议在本地或 HTTP 环境下使用。");
    }

  </script>
</body>

</html>
